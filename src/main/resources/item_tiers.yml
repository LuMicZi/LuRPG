# ===========================================
# LuRPG Item Tiers Configuration
# 物品品级系统配置
# ===========================================
# 品级列表（从低到高排列）
# 每个品级有独立的显示名、颜色、属性倍率和随机权重

tiers:
  rough:
    name: "粗糙"
    color: "<dark_gray>"
    multiplier: 0.7
    weight: 15
  common:
    name: "普通"
    color: "<gray>"
    multiplier: 0.9
    weight: 30
  fine:
    name: "精良"
    color: "<white>"
    multiplier: 1.0
    weight: 25
  excellent:
    name: "优秀"
    color: "<green>"
    multiplier: 1.15
    weight: 15
  epic:
    name: "史诗"
    color: "<dark_purple>"
    multiplier: 1.3
    weight: 8
  legendary:
    name: "传说"
    color: "<gold>"
    multiplier: 1.5
    weight: 5
  mythic:
    name: "神话"
    color: "<light_purple>"
    multiplier: 1.75
    weight: 2

# 升级成功率（从当前品级升到下一级的成功率）
# 键为当前品级ID，值为成功率（0.0 ~ 1.0）
upgrade-chances:
  rough: 1.0       # 100%
  common: 0.9      # 90%
  fine: 0.75       # 75%
  excellent: 0.55  # 55%
  epic: 0.35       # 35%
  legendary: 0.15  # 15%
