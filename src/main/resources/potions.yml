    custom-model-data: 30005

  # Detox potions
  antidote_potion:
    display-name: "<gradient:#00ffff:#00aaaa>解毒药水"
    material: POTION
    potion-color: AQUA
    level-requirement: 1
    type: DETOX
    effects:
      cure:
        types: [POISON, WITHER, WEAKNESS, SLOW]
    cooldown: 20
    max-stack: 5
    lore-template: common
    custom-model-data: 30006

  # Resource potions
  mana_potion:
