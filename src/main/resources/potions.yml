# ===========================================
# LuRPG Potions Configuration
# ===========================================

potions:
  # Instant healing potions
  minor_healing_potion:
    display-name: "<gradient:#ff6666:#ff0000>初级治疗药水"
    material: POTION
    potion-color: RED
    level-requirement: 1
    type: INSTANT_HEAL
    effects:
      heal:
        type: INSTANT
        amount: 30
    cooldown: 30
    max-stack: 3
    lore-template: common
    custom-model-data: 30001

  greater_healing_potion:
    display-name: "<gradient:#ff0000:#990000>高级治疗药水"
    material: POTION
    potion-color: DARK_RED
    level-requirement: 10
    type: INSTANT_HEAL
    effects:
      heal:
        type: INSTANT
        amount: 80
      buff:
        stat: PHYSICAL_DEFENSE
        multiplier: 1.2
        duration: 200
    cooldown: 30
    max-stack: 3
    lore-template: rare
    custom-model-data: 30002

  # Regeneration potions
  regeneration_potion:
    display-name: "<gradient:#00ff00:#00aa00>持续恢复药水"
    material: POTION
    potion-color: GREEN
    level-requirement: 5
    type: REGEN
    effects:
      regen:
        amount: 5
        duration: 100
        interval: 20
    cooldown: 60
    max-stack: 2
    lore-template: rare
    custom-model-data: 30003

  # Buff potions
  strength_potion:
    display-name: "<gradient:#ff8800:#ff4400>力量药水"
    material: POTION
    potion-color: ORANGE
    level-requirement: 8
    type: BUFF
    effects:
      buff:
        stat: PHYSICAL_ATTACK
        multiplier: 1.3
        duration: 600
    cooldown: 120
    max-stack: 1
    lore-template: epic
    custom-model-data: 30004

  magic_power_potion:
    display-name: "<gradient:#9b59b6:#8e44ad>魔力增幅药水"
